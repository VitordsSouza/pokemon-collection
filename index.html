<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Collection</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <header>
      <img class="side-menu-img" src="img/side-menu.png" alt="Menu lateral" />
      <img class="logo-img" src="img/logo.png" alt="Logo" />
      <img class="perfil-img" src="img/profile.jpg" alt="Foto de perfil" />
    </header>

    <section class="secao-de-pesquisa">
      <input
        type="text"
        placeholder="Ex.: Charizard ou Charizard 4/102"
        aria-label="Buscar carta"
      />
      <button>Buscar</button>
    </section>

    <section class="secao-resultados-pesquisa" hidden>
      <h3>Resultados da busca</h3>
      <p class="status-pesquisa" role="status"></p>
      <div class="grid-minha-colecao grid-resultados"></div>
    </section>

    <section class="resumo-colecao-secao">
      <div class="resumo-colecao">
        <h2>Resumo da Coleção</h2>
        <div>
          <p class="label">Valor total da coleção</p>
          <h3 class="valor-total-colecao">0</h3>
          <p class="delta">▲ +5,2% em relação ao mês passado</p>
        </div>
        <ul>
          <li>
            <p>Total de cartas</p>
            <p class="total-cartas">0</p>
          </li>
          <li>
            <p>Cartas únicas</p>
            <p>129</p>
          </li>
          <li>
            <p>Coleções</p>
            <p>12</p>
          </li>
          <li>
            <p>Cartas desejadas</p>
            <p>23</p>
          </li>
        </ul>
      </div>
    </section>

    <section class="secao-colecoes">
      <div class="div-colecoes">
        <h3>Coleções</h3>
        <div class="row-colecao">
          <p>151</p>
          <div class="progress-bar-colecao">
            <div class="progress-bar-colecao-fill" id="c-151"></div>
            <span>123/180</span>
          </div>
        </div>

        <div class="row-colecao">
          <p>Fogo fantasmagórico</p>
          <div class="progress-bar-colecao">
            <div
              class="progress-bar-colecao-fill"
              id="c-fogo-fantasmagorico"
            ></div>
            <span>71/94</span>
          </div>
        </div>

        <div class="row-colecao">
          <p>Caos ascendente</p>
          <div class="progress-bar-colecao">
            <div class="progress-bar-colecao-fill" id="c-caos-ascendente"></div>
            <span>23/87</span>
          </div>
        </div>
      </div>
    </section>

    <section class="secao-minha-colecao">
      <h3>Minha Coleção</h3>
      <div class="inputs-minha-colecao">
        <input type="text" placeholder="Buscar carta na coleção..." />
        <select name="" id="">
          <option value="" selected>Todas as coleções</option>
          <option value="">151</option>
          <option value="">Caos ascendente</option>
          <option value="">Fogo fantasmagórico</option>
        </select>
        <select name="" id="">
          <option value="">Ordenar</option>
          <option value="">Valor</option>
          <option value="">Mais recente</option>
        </select>
      </div>

      <div class="grid-minha-colecao"></div>
    </section>

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
